- Other:
    - Calendar:
        widget:
          type: calendar
          firstDayInWeek: sunday
          view: monthly
          maxEvents: 10
          showTime: true
          timezone: America/Los_Angeles
          integrations:
            - type: sonarr
              service_group: Media
              service_name: Sonarr
              color: teal
            - type: radarr
              service_group: Media
              service_name: Radarr
              color: red
            - type: lidarr
              service_group: Media2
              service_name: lidarr
              color: blue
            - type: readarr
              service_group: Media
              service_name: readarr
              color: purple
            - type: ical
              name: Coursera
              color: zinc
              url: http://www.coursera.org/api/learnerCalendars.v1/46974119/uRHz9JWGSM2swl2Uux8vHg.ics
              params:
                showName: true
