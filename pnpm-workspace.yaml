packages:
  - .

allowBuilds:
  '@tailwindcss/oxide': true
  core-js: false
  cpu-features: false
  esbuild: false
  osx-temperature-sensor: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

# gamedig pins fast-xml-parser to 5.8.0, which is affected by GHSA-474x-hrwr-fgx4
overrides:
  'gamedig>fast-xml-parser': ^5.12.0

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - osx-temperature-sensor
  - protobufjs
  - sharp
